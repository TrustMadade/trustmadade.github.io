<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {{ site.seo }}
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
      }
      nav {
        margin-bottom: 1.5rem;
      }
      nav a {
        margin-right: 12px;
        font-weight: bold;
        text-decoration: none;
      }
      .project-tag {
        display: inline-block;
        padding: 3px 10px;
        font-size: 0.8rem;
        border-radius: 5px;
        background: #eef;
        color: #224;
        margin-top: 5px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>{{ site.title }}</h1>
      <nav>
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/resume/">Resume</a>
        <a href="/contact/">Contact</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      <hr />
      <p>© {{ site.time | date: '%Y' }} {{ site.author }} | Built with GitHub Pages</p>
    </footer>
  </body>
</html>
