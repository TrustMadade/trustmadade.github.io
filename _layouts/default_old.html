<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} | {{ site.author }}</title>
    {% seo %}
    <link rel="icon" href="{{ site.baseurl }}/{{ site.favicon }}" />
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}" />
  </head>

  <body>
    <!-- ✅ Sticky Nav Bar -->
    <header style="position: sticky; top: 0; background: white; border-bottom: 1px solid #ddd; z-index: 1000;">
      <nav style="max-width: 960px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem;">
        <a href="{{ site.baseurl }}/" style="font-weight: bold;">{{ site.author }}</a>
        <div style="display: flex; gap: 1rem;">
          <a href="{{ site.baseurl }}/about">About</a>
          <a href="{{ site.baseurl }}/projects">Projects</a>
          <a href="{{ site.baseurl }}/resume">Resume</a>
          <a href="{{ site.baseurl }}/contact">Contact</a>
        </div>
      </nav>
    </header>

    <!-- ✅ Main Content -->
    <main class="container">
      {{ content }}
    </main>

    <!-- ✅ Optional Footer -->
    <footer style="text-align: center; padding: 2rem; font-size: 14px;">
      © {{ site.time | date: '%Y' }} {{ site.author }}. Built with Jekyll.
    </footer>
  </body>
</html>
